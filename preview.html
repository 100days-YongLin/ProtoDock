<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProtoDock 公开预览</title>
  <link rel="icon" type="image/png" href="/assets/protodock-icon.png">
  <link rel="apple-touch-icon" href="/assets/protodock-icon.png">
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css">
  <link rel="stylesheet" href="/vendor/devices.css">
  <link rel="stylesheet" href="/product-document.css?v=14">
  <link rel="stylesheet" href="/preview.css?v=10">
</head>
<body class="share-document">
  <header class="document-header">
    <div class="document-brand">
      <a class="document-back-button" id="canvasLink" href="#" title="查看流程图">
        <i data-lucide="network"></i>
        <span>流程图</span>
      </a>
      <button class="document-presentation-button" id="openPresentation" type="button" title="正在准备可操作原型" disabled>
        <i data-lucide="presentation"></i>
        <span>全屏演示</span>
      </button>
      <img src="/assets/protodock-icon.png" alt="">
      <strong>产品文档</strong>
    </div>
    <div class="document-project-name" id="documentProjectName">正在准备文档</div>
    <div class="document-actions">
      <span class="document-progress" id="documentProgress" aria-live="polite">等待项目数据</span>
      <button class="icon-button" id="toggleOutline" type="button" title="查看目录" aria-label="查看目录" aria-expanded="false">
        <i data-lucide="list"></i>
      </button>
      <button class="icon-button" id="printDocument" type="button" title="下载 A4 PDF" aria-label="下载 A4 PDF" disabled>
        <i data-lucide="file-down"></i>
      </button>
      <a class="icon-button" id="downloadLink" href="#" title="下载项目包" aria-label="下载项目包">
        <i data-lucide="download"></i>
      </a>
    </div>
  </header>

  <div class="document-layout">
    <aside class="document-outline" id="documentOutline">
      <div class="outline-heading">
        <strong>原型页面</strong>
        <span id="outlinePageCount">0 个页面</span>
      </div>
      <nav id="outlineNavigation" aria-label="产品文档目录"></nav>
    </aside>

    <main class="document-content" id="documentContent">
      <section class="document-loading" id="documentLoading">
        <img src="/assets/protodock-icon.png" alt="">
        <strong>正在读取产品文档</strong>
        <p>页面文档和可操作原型加载完成后即可直接查看。</p>
        <div class="loading-track"><i id="loadingProgress"></i></div>
      </section>

      <section class="document-cover" id="documentCover" hidden>
        <span class="cover-label">ProtoDock Product Requirement Document</span>
        <h1 id="coverTitle"></h1>
        <p id="coverDescription"></p>
        <dl class="cover-meta">
          <div><dt>页面</dt><dd id="coverPageCount"></dd></div>
          <div><dt>业务分组</dt><dd id="coverGroupCount"></dd></div>
          <div><dt>更新方式</dt><dd>实时读取公开项目</dd></div>
        </dl>
        <section class="cover-changelog" aria-labelledby="coverChangeLogTitle">
          <header>
            <div><span>Project updates</span><h2 id="coverChangeLogTitle">变更历史</h2></div>
            <strong id="coverCurrentVersion" hidden></strong>
          </header>
          <ol id="coverChangeLogList"></ol>
        </section>
      </section>

      <div id="documentSections"></div>
    </main>
  </div>

  <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/project-changelog.js?v=6"></script>
  <script src="/share-reference.js?v=4"></script>
  <script src="/product-document.js?v=7"></script>
  <script src="/capture.js?v=8"></script>
  <script src="/product-document-cache.js?v=4"></script>
  <script src="/pdf-export.js?v=1"></script>
  <script src="/prototype-navigation.js?v=3"></script>
  <script src="/prototype-presentation.js?v=4"></script>
  <script src="/preview.js?v=32"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精彩片段</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f8fafc;
      color: #172033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    main { min-height: 100vh; display: grid; gap: 14px; align-content: start; padding: 18px; }
    header { display: grid; gap: 8px; }
    .back { color: #0b74de; font-size: 13px; font-weight: 700; }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .tabs { display: flex; gap: 8px; overflow: hidden; }
    .tab { flex: 1; border-radius: 999px; background: #e8eef7; color: #4b5565; padding: 9px 12px; text-align: center; font-size: 12px; font-weight: 700; }
    .tab.active { background: #172033; color: #fff; }
    .timeline { display: grid; gap: 10px; }
    .item {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #fff;
      padding: 10px;
      box-shadow: 0 14px 34px rgba(23, 32, 51, 0.08);
    }
    .poster { display: grid; place-items: end start; min-height: 86px; border-radius: 16px; padding: 8px; color: #fff; font-size: 11px; background: linear-gradient(145deg, #20304a, #7cc7ff); }
    .poster.green { background: linear-gradient(145deg, #12443b, #73d7b5); }
    .poster.gold { background: linear-gradient(145deg, #5b3b00, #ffc75f); }
    .copy { display: grid; gap: 6px; align-content: center; }
    .copy strong { font-size: 14px; }
    .copy span { color: #667085; font-size: 12px; line-height: 1.45; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tags span { border-radius: 999px; background: #eef4ff; color: #0b74de; padding: 4px 7px; font-size: 10px; }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="back">返回首页</span>
      <h1>精彩片段</h1>
      <div class="tabs">
        <span class="tab active">全部</span>
        <span class="tab">互动</span>
        <span class="tab">专注</span>
      </div>
    </header>

    <section class="timeline">
      <article class="item">
        <div class="poster">01:24</div>
        <div class="copy">
          <strong>主动分享玩具</strong>
          <span>出现清晰的轮流表达和积极回应。</span>
          <div class="tags"><span>互动</span><span>积极</span></div>
        </div>
      </article>
      <article class="item">
        <div class="poster green">00:58</div>
        <div class="copy">
          <strong>专注阅读</strong>
          <span>连续观察绘本，注意力保持稳定。</span>
          <div class="tags"><span>专注</span><span>阅读</span></div>
        </div>
      </article>
      <article class="item">
        <div class="poster gold">02:10</div>
        <div class="copy">
          <strong>小组搭建</strong>
          <span>与同伴协作完成积木结构。</span>
          <div class="tags"><span>协作</span><span>表达</span></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>

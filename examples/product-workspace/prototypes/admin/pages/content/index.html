<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18181b;font-family:system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:900px}.nav{border-right:1px solid #dfe1e5;background:#fff;padding:28px 20px}.nav strong{font-size:18px}.nav span{display:block;margin-top:32px;color:#0878e8}.main{padding:40px}h1{margin:0 0 28px}.table{overflow:hidden;border:1px solid #dfe1e5;border-radius:8px;background:#fff}.row{display:grid;grid-template-columns:2fr 1fr 1fr;padding:17px 20px;border-bottom:1px solid #eceef1}.row:last-child{border:0}.head{color:#6b7280;font-size:13px;font-weight:700}
  </style>
</head>
<body><main class="app"><aside class="nav"><strong>产品管理</strong><span>内容管理</span></aside><section class="main"><h1>内容管理</h1><div class="table"><div class="row head"><span>名称</span><span>状态</span><span>更新时间</span></div><div class="row"><span>产品使用指南</span><span>已发布</span><span>今天 10:30</span></div><div class="row"><span>账户安全提醒</span><span>草稿</span><span>昨天 18:20</span></div></div></section></main></body>
</html>

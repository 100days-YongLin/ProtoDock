<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复制 GitHub 链接</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #18181b;
      background: #f4f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 640px);
      padding: 28px;
      border: 1px solid #dfe1e5;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(24, 24, 27, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      color: #686b73;
      line-height: 1.6;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cfd2d8;
      border-radius: 6px;
      font: inherit;
      color: #26272b;
      background: #fafafa;
    }

    button {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      font: 600 16px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: #1677ff;
      cursor: pointer;
    }

    button:disabled {
      color: #91949b;
      background: #e8eaed;
      cursor: default;
    }

    #status {
      min-height: 24px;
      margin-top: 14px;
      margin-bottom: 0;
      color: #15803d;
    }

    #status[data-error="true"] {
      color: #c2410c;
    }
  </style>
</head>
<body>
  <main>
    <h1>复制 GitHub 链接</h1>
    <p>页面会自动尝试复制；若浏览器拦截，请点击下方按钮。</p>
    <input id="link" type="url" readonly aria-label="GitHub 链接">
    <button id="copy" type="button">复制 GitHub 链接</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const link = document.getElementById('link');
    const button = document.getElementById('copy');
    const status = document.getElementById('status');
    const value = new URLSearchParams(window.location.search).get('url') || '';

    function validHttpUrl(candidate) {
      try {
        const parsed = new URL(candidate);
        return parsed.protocol === 'https:' || parsed.protocol === 'http:';
      } catch {
        return false;
      }
    }

    async function copyLink() {
      if (!validHttpUrl(value)) {
        status.textContent = '链接无效，请返回 ProtoDock 重新发布。';
        status.dataset.error = 'true';
        button.disabled = true;
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
        status.textContent = 'GitHub 链接已复制，可以直接粘贴给 AI。';
        status.dataset.error = 'false';
      } catch {
        link.focus();
        link.select();
        const copied = document.execCommand('copy');
        status.textContent = copied
          ? 'GitHub 链接已复制，可以直接粘贴给 AI。'
          : '浏览器阻止了自动复制，请长按或选中上方链接复制。';
        status.dataset.error = copied ? 'false' : 'true';
      }
    }

    link.value = validHttpUrl(value) ? value : '';
    button.addEventListener('click', copyLink);
    copyLink();
  </script>
</body>
</html>
